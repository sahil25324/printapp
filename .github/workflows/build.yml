name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create project, add code, build
        run: |
          flutter create --platforms=android --project-name wifi_print_scan app
          cd app
          flutter pub add multicast_dns http file_picker:^8.3.7 pdf
          
      - name: Create project, add code, build
        run: |
          flutter create --platforms=android --project-name wifi_print_scan app
          cd app
          flutter pub add multicast_dns http file_picker:^8.3.7 pdf

          # file_picker ka compileSdk 36 karo
          find "$HOME/.pub-cache" -path '*/file_picker-8.3.7/android/build.gradle' -exec sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/; s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' {} \;

          cp ../main.dart lib/main.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/><application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

          cp ../main.dart lib/main.dart
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/><application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml
          # file_picker 8.3.7 Android AAR metadata workaround
          find "$HOME/.pub-cache/hosted/pub.dev/file_picker-8.3.7" -name build.gradle -type f -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g; s/compileSdk = 34/compileSdk = 36/g; s/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g; s/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' {} +
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
